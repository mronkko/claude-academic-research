name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Installs the `dev` dependency group from pyproject.toml (PEP 735).
      # Deliberately NOT a hand-written package list: the previous list drifted
      # from [dependency-groups] and left `uv sync` unable to collect 14 test
      # modules. pyproject.toml is the one source of truth — the guard in
      # tests/unit/test_ci_dependencies.py fails the build if this regresses.
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --group dev

      - name: Ruff lint
        run: ruff check scripts tests

      - name: Run tests
        run: pytest tests -v
