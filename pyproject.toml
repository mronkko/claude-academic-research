[project]
name = "claude-academic-research"
version = "0.3.1"
description = "Dev/test tooling for the claude-academic-research plugin (compatible with Claude Code and Antigravity). Runtime scripts use uv + PEP 723 inline deps and do not depend on this pyproject."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mikko Rönkkö", email = "mikko.ronkko@jyu.fi" }]

# The single source of truth for what the test suite needs. CI installs
# exactly this group (`pip install --group dev`); do not hand-list packages
# in .github/workflows/ci.yml — that second list drifted out of sync and
# left `uv sync` unable to collect 14 test modules.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
    "ruff>=0.6",
    # zotero_io.py and http_client.py import tenacity at module scope; without
    # it 14 test modules fail to collect.
    "tenacity>=8.0",
    # These three arrive transitively via zotero-mcp-server today. Declared
    # explicitly so the suite does not silently depend on that package's
    # dependency choices.
    "pyzotero>=1.6",
    "httpx>=0.25",
    "requests>=2.31",
    # `core/llm_provider.py` imports openai lazily for the four
    # providers that share the OpenAI-compatible transport.
    "openai>=1.0",
    # Without reportlab, the XML-fallback rendering assertion in
    # tests/unit/test_sciencedirect_preview_fallback.py silently pytest.skips.
    "reportlab>=4.0",
    # Same silent-skip problem, on the `live` suite: these two gate live
    # tests behind `pytest.importorskip`, so the entitlement they exist to
    # verify goes untested while test_live_coverage.py still sees a test
    # for the key. pybliometrics gates test_scopus_abstract and
    # test_sciencedirect_abstract; wiley-tdm gates test_wiley_tdm_downloads_pdf.
    # Versions match the PEP 723 blocks in scripts/pipelines/enrich_*.py, so
    # the suite exercises what the pipeline actually resolves at runtime.
    "pybliometrics>=3.6",
    "wiley-tdm>=0.2",
    "zotero-mcp-server>=0.9,<0.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not live and not live_browser and not live_slr and not live_cluster'"
markers = [
    "live: direct-HTTP live-endpoint tests (PDF + abstract + auth); opt in with `pytest -m live`",
    "live_browser: Playwright live tests for Cloudflare-gated publishers (user clicks through CF); opt in with `pytest -m live_browser`",
    "live_slr: full live end-to-end mini systematic review against a real Zotero group (~5-12 min, real API spend); opt in with `pytest -m live_slr`",
    "live_cluster: batch screening against a real GPU cluster over ssh/sbatch; needs ACADEMIC_RESEARCH_CLUSTER_HOST and queue time, and can never run in CI; opt in with `pytest -m live_cluster`",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

# `scripts/cluster/run_batch.py` is copied to a GPU cluster and run by
# whatever interpreter the site's module system provides, which is
# routinely older than this repository's 3.11 floor. It is the one file
# here that must stay Python 3.9-compatible, so the pyupgrade rules that
# rewrite to 3.10+/3.11+ constructs are off for it:
#   UP017 `timezone.utc` -> `datetime.UTC`   (3.11+)
#   UP038 isinstance tuple -> `X | Y`        (3.10+ at runtime)
#   B905  `zip(...)` -> `zip(..., strict=)`  (3.10+)
# This is not hypothetical: a `ruff check --fix --unsafe-fixes` pass
# introduced the first and third, and the third was caught only by
# running the file on a real 3.9. `tests/unit/test_cluster_runner.py`
# guards both the syntax (parsed at 3.9's feature version) and these
# specific names, so the exemption and the test back each other up.
[tool.ruff.lint.per-file-ignores]
"scripts/cluster/*.py" = ["UP017", "UP038", "B905"]

# IDE static analysis: pipeline scripts add `scripts/` to sys.path at runtime
# so they can import sibling packages (sources, core). Tell the
# analyzer about it so imports like `from sources.predatory import ...`
# resolve without warnings. `templates/` is on the list so the test
# templates (`test_citations.py`, `test_empirical_integrity.py`, `test_systematic_review.py`)
# can import their sibling `test_common.py` — they sit next to each other
# once copied into a project's `scripts/` directory.
[tool.pyrefly]
search-path = ["scripts", "scripts/pipelines", "templates"]

[tool.pyright]
extraPaths = ["scripts", "scripts/pipelines", "templates"]
